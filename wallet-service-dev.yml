spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
        spring.json.type.mapping: >
          walletDebitedEvent:com.novapay.wallet_service.saga.event.WalletDebitedEvent,
          walletRefundedEvent:com.novapay.wallet_service.saga.event.WalletRefundedEvent

    consumer:
      group-id: wallet-saga-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.novapay.payment_service,com.novapay.wallet_service
        spring.json.type.mapping: >
          debitWalletCommand:com.novapay.wallet_service.saga.event.DebitWalletCommand,
          walletRefundCommand:com.novapay.wallet_service.saga.event.WalletRefundCommand
          
  datasource:
    url: jdbc:postgresql://localhost:5432/wallet_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver  

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
